name: Shoretel
description: 'ShoreTel was a Sunnyvale, California business communications company founded in 1996 that
  built IP-based unified communications (UC), VoIP phone systems, and contact-center products for the
  enterprise, spanning on-premises ShoreTel systems and the cloud-hosted ShoreTel Sky platform. Mitel
  Networks acquired ShoreTel in September 2017 for roughly USD 530 million and folded its products into
  the Mitel Connect line. ShoreTel no longer operates as an independent company: the shoretel.com domain
  now 301-redirects to mitel.com, and there is no independent ShoreTel developer portal, API reference,
  or OpenAPI surface. Legacy integration surfaces (for example the ShoreTel Sky Hosted API and Exchange
  Web Services integrations) are now documented and hosted under Mitel. This record was surfaced as a
  Norwest Venture Partners portfolio company and enriched to reflect its acquired, defunct-as-independent
  status.'
